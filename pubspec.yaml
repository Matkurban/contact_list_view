name: contact_list_view
description: "A Flutter sliver-based contact list with A-Z index navigation, sticky section headers, and extensible builders for index, cursor, and header rendering."
version: 2.0.0
homepage: https://github.com/Matkurban
repository: https://github.com/Matkurban/contact_list_view
topics:
  - widget
  - azlistview
  - contact
  - chat
screenshots:
  - description: "contact list"
    path: doc/images/Screenshot_20260202_224751.jpg
  - description: "contact list"
    path: doc/images/Screenshot_20260202_222935.jpg

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  signals_flutter: ^7.1.0
  scrollview_observer: 
    git:
      url: https://github.com/Matkurban/flutter_scrollview_observer.git
      ref: main
  
  value_layout_builder: ^0.5.0

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  signals_lint: ^7.1.0
